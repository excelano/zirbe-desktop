[workspace]
members = ["store"]

[package]
name = "zirbe"
description = "Email that reads like a conversation"
version = "0.1.2"
edition = "2024"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/zirbe-desktop"
publish = false
rust-version = "1.98"

[[bin]]
name = "zirbe"
path = "src/main.rs"

[dependencies]
zirbe-store = { path = "store" }
chrono = "0.4"
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
open = "5"
png = { version = "0.18", optional = true }
tao = "0.37"
wry = "0.57"
rfd = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
zbus = "5"

[features]
screenshot = ["dep:png"]

[profile.release]
lto = "thin"
