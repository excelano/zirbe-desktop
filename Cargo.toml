[workspace]
members = ["store"]

[package]
name = "zirbe"
description = "Email that reads like a conversation"
version = "0.10.0"
edition = "2024"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/zirbe-desktop"
publish = false
rust-version = "1.98"

[[bin]]
name = "zirbe"
path = "src/main.rs"

[dependencies]
zirbe-store = { path = "store" }
chrono = "0.4"
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
open = "5"
png = { version = "0.18", optional = true }
rfd = "0.18"
blitz-html = "=0.3.0-beta.4"
blitz-dom = { version = "=0.3.0-beta.4", features = ["floats"] }
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
ureq = "3"
base64 = "0.23"
# Blitz decodes pictures through image, which it builds with no formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Blitz's fontique must open fontconfig at run time, as eframe's does.
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[features]
screenshot = ["dep:png"]

[profile.release]
lto = "thin"
