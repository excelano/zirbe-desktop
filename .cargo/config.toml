# The Visual C++ runtime is not part of Windows. Linking it in statically means
# a clean machine without the redistributable can start the application, which
# Microsoft Store certification checks.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
